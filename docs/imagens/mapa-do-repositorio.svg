<title id="title">O que você encontra aqui</title>
<desc id="desc">Comece pelo SmartChat gratuito para conversar sobre o que precisa. Para automatizar uma tarefa, escolha conforme sua necessidade: tarefas prontas e exemplos gratuitos, ou modelo de planejamento de tarefas com SmartChat, pago e opcional, para criar instruções personalizadas. O repositório também oferece guias de instalação, uso e perguntas frequentes.</desc>

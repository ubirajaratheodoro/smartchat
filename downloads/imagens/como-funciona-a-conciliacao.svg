 <title id="title">Dos documentos à sua planilha</title><desc id="desc">1. Informe pasta e período. Anexe as instruções prontas e responda às perguntas iniciais. 2. Acompanhe a conferência. O SmartChat relaciona movimentos, documentos e saldos. 3. Esclareça as dúvidas. Confirme categorias e vínculos e decida sobre as pendências. 4. Revise a planilha. Confira os lançamentos e os totais antes de aprovar a entrega.</desc>

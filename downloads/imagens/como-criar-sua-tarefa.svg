 <title id="title">Da sua ideia à tarefa reutilizável</title><desc id="desc">1. Descreva o que precisa. Anexe o modelo e conte qual tarefa deseja automatizar. 2. Responda às perguntas. O SmartChat ajuda a definir dados, regras e resultado esperado. 3. Revise as instruções. Confira e aprove o arquivo que orientará a sua tarefa. 4. Teste e reutilize. Execute com os documentos e os acessos necessários.</desc>

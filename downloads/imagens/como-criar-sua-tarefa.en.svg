<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1160" viewBox="0 0 960 1160" role="img" aria-labelledby="title desc"><title id="title">Create once. Test and reuse.</title><desc id="desc">1 · CREATE THE INSTRUCTIONS: Attach the template to SmartChat; Explain what you need; Answer the questions, one at a time; Review and save the file it creates. 2 · RUN THE TASK: Attach the new file in a new conversation; Provide the requested documents; Test and check the result. For future runs, reuse the file you created. If the task changes, review the instructions.</desc><rect width="960" height="1160" rx="24" fill="#F4F7F8"/><path d="M24 0h912q24 0 24 24v150H0V24Q0 0 24 0" fill="#132D3A"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="68" font-size="45" font-weight="700" fill="white">Create once. Test and reuse.</text><text x="40" y="116" font-size="26" fill="#C9D8DF">From template to instructions. From instructions to action.</text><rect x="40" y="190" width="880" height="416" rx="20" fill="white" stroke="#C1DCD5"/><text x="68" y="243" font-size="31" font-weight="700" fill="#087F70">1 · CREATE THE INSTRUCTIONS</text><circle cx="82" cy="295" r="15" fill="#087F70"/><text x="114" y="305" font-size="30" fill="#244654">Attach the template to SmartChat</text><circle cx="82" cy="371" r="15" fill="#087F70"/><text x="114" y="381" font-size="30" fill="#244654">Explain what you need</text><circle cx="82" cy="447" r="15" fill="#087F70"/><text x="114" y="457" font-size="30" fill="#244654">Answer the questions, one at a time</text><circle cx="82" cy="523" r="15" fill="#087F70"/><text x="114" y="533" font-size="30" fill="#244654">Review and save the file it creates</text><path d="M480 618v24m-8-9 8 9 8-9" fill="none" stroke="#087F70" stroke-width="4"/><rect x="130" y="655" width="700" height="54" rx="27" fill="#E1F3ED"/><text x="480" y="690" text-anchor="middle" font-size="24" font-weight="700" fill="#087F70">REVIEWED TASK INSTRUCTION FILE</text><rect x="40" y="748" width="880" height="312" rx="20" fill="white" stroke="#BCD6E6"/><text x="68" y="802" font-size="31" font-weight="700" fill="#176F9B">2 · RUN THE TASK</text><circle cx="82" cy="853" r="15" fill="#176F9B"/><text x="114" y="863" font-size="30" fill="#244654">Attach the new file in a new conversation</text><circle cx="82" cy="929" r="15" fill="#176F9B"/><text x="114" y="939" font-size="30" fill="#244654">Provide the requested documents</text><circle cx="82" cy="1005" r="15" fill="#176F9B"/><text x="114" y="1015" font-size="30" fill="#244654">Test and check the result</text><text x="40" y="1104" font-size="24" fill="#405A66">For future runs, reuse the file you created.</text><text x="40" y="1138" font-size="24" fill="#405A66">If the task changes, review the instructions.</text><text x="920" y="1138" text-anchor="end" font-size="24" font-weight="700" fill="#142D3A">SmartChat</text></g></svg>